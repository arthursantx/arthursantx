<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">NEXUS · Strategic Technology Management Platform</title>
  <desc id="d">Projeto em destaque: plataforma que conecta necessidades das áreas, priorização, portfólio, decisões executivas e valor entregue. Demonstração com dados fictícios.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1428"/><stop offset="1" stop-color="#0f2350"/></linearGradient>
    <radialGradient id="gl" cx=".78" cy=".5" r=".55"><stop offset="0" stop-color="#3b82f6" stop-opacity=".35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
    <clipPath id="r"><rect width="1280" height="560" rx="24"/></clipPath>
    <clipPath id="w"><rect x="690" y="70" width="540" height="420" rx="14"/></clipPath>
    <style>
      text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .k{font-weight:600;font-size:14px;letter-spacing:3.5px;fill:#7dd3fc}
      .h{font-weight:700;font-size:44px;fill:#fff;letter-spacing:-.5px}
      .sub{font-weight:500;font-size:20px;fill:#93c5fd}
      .p{font-size:18px;fill:#c7d2e6}
      .chip{font-weight:600;font-size:15px;fill:#e2e8f0}
      .ui{font-size:9.5px;fill:#64748b}
      .uib{font-weight:700;font-size:15px}
      .nav{font-size:9.5px;fill:#cbd5e1}
      .grow{animation:g 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
      @keyframes g{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
      @media (prefers-reduced-motion:reduce){.grow{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="560" fill="url(#bg)"/>
    <rect width="1280" height="560" fill="url(#gl)"/>
    <rect x=".5" y=".5" width="1279" height="559" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

    <text class="k" x="64" y="92">PROJETO EM DESTAQUE · FEATURED PROJECT</text>
    <rect x="64" y="118" width="56" height="56" rx="14" fill="#2563eb"/>
    <text x="92" y="157" text-anchor="middle" style="font-weight:800;font-size:30px;fill:#fff">N</text>
    <text class="h" x="138" y="163" style="letter-spacing:6px">NEXUS</text>
    <text class="sub" x="64" y="214">Strategic Technology Management Platform</text>
    <text class="p" x="64" y="262">Da necessidade de negócio à decisão executiva:</text>
    <text class="p" x="64" y="290">pedidos das áreas, priorização com score explicável,</text>
    <text class="p" x="64" y="318">portfólio, decisões registradas e valor medido.</text>

    <g transform="translate(64 352)">
      <rect width="196" height="40" rx="20" fill="#1e3a8a" fill-opacity=".55" stroke="#60a5fa" stroke-opacity=".45"/>
      <text class="chip" x="98" y="26" text-anchor="middle">Ciclo completo</text>
      <rect x="208" width="208" height="40" rx="20" fill="#1e3a8a" fill-opacity=".55" stroke="#60a5fa" stroke-opacity=".45"/>
      <text class="chip" x="312" y="26" text-anchor="middle">Score explicável</text>
      <rect y="52" width="226" height="40" rx="20" fill="#1e3a8a" fill-opacity=".55" stroke="#60a5fa" stroke-opacity=".45"/>
      <text class="chip" x="113" y="78" text-anchor="middle">Confirmado ≠ estimado</text>
      <rect x="238" y="52" width="178" height="40" rx="20" fill="#1e3a8a" fill-opacity=".55" stroke="#60a5fa" stroke-opacity=".45"/>
      <text class="chip" x="327" y="78" text-anchor="middle">Decisão registrada</text>
    </g>
    <text x="64" y="490" style="font-size:15px;fill:#8ea0bd">React · TypeScript · Vite · PT/EN · Acessibilidade · Testes automatizados</text>

    <!-- janela do app (ilustração) -->
    <g filter="url(#sh)">
      <rect x="690" y="70" width="540" height="420" rx="14" fill="#f1f5f9"/>
    </g>
    <g clip-path="url(#w)">
      <rect x="690" y="70" width="540" height="26" fill="#e2e8f0"/>
      <circle cx="706" cy="83" r="4.5" fill="#f87171"/><circle cx="721" cy="83" r="4.5" fill="#fbbf24"/><circle cx="736" cy="83" r="4.5" fill="#34d399"/>
      <rect x="690" y="96" width="120" height="394" fill="#0b1630"/>
      <rect x="702" y="108" width="20" height="20" rx="5" fill="#2563eb"/><text x="712" y="122" text-anchor="middle" style="font-weight:800;font-size:11px;fill:#fff">N</text>
      <text x="728" y="122" style="font-weight:700;font-size:11px;fill:#fff">NEXUS</text>
      <rect x="698" y="146" width="104" height="20" rx="5" fill="#1e3a8a"/>
      <text class="nav" x="708" y="159" fill="#fff">Executive Overview</text>
      <text class="nav" x="708" y="185">Business Needs</text>
      <text class="nav" x="708" y="207">Prioritization</text>
      <text class="nav" x="708" y="229">Portfolio</text>
      <text class="nav" x="708" y="251">Intelligence</text>
      <text class="nav" x="708" y="273">Decisions</text>
      <text class="nav" x="708" y="295">Value Tracking</text>
      <text x="826" y="124" style="font-weight:700;font-size:15px;fill:#0f172a">Executive Overview</text>
      <text class="ui" x="826" y="139">Dados fictícios de demonstração</text>
      <rect x="826" y="150" width="390" height="60" rx="8" fill="#fff" stroke="#e2e8f0"/>
      <rect x="826" y="150" width="3" height="60" fill="#2563eb"/>
      <text x="838" y="167" style="font-weight:700;font-size:10px;fill:#0f172a">O que pede atenção agora</text>
      <circle cx="841" cy="181" r="2.5" fill="#ef4444"/><rect x="849" y="178" width="250" height="5" rx="2.5" fill="#cbd5e1"/>
      <circle cx="841" cy="194" r="2.5" fill="#f59e0b"/><rect x="849" y="191" width="200" height="5" rx="2.5" fill="#cbd5e1"/>
      <g transform="translate(826 220)">
        <rect width="92" height="56" rx="8" fill="#fff" stroke="#e2e8f0"/><text class="ui" x="9" y="17">Necessidades</text><text class="uib" x="9" y="41" fill="#0f172a">6</text>
        <rect x="99" width="92" height="56" rx="8" fill="#fff" stroke="#e2e8f0"/><text class="ui" x="108" y="17">Iniciativas</text><text class="uib" x="108" y="41" fill="#0f172a">5</text>
        <rect x="198" width="92" height="56" rx="8" fill="#fff" stroke="#e2e8f0"/><text class="ui" x="207" y="17">Orçamento</text><text class="uib" x="207" y="41" fill="#0f172a">R$ 1,7 mi</text>
        <rect x="297" width="93" height="56" rx="8" fill="#fff" stroke="#e2e8f0"/><text class="ui" x="306" y="17">Em risco</text><text class="uib" x="306" y="41" fill="#dc2626">2</text>
      </g>
      <rect x="826" y="286" width="232" height="190" rx="8" fill="#fff" stroke="#e2e8f0"/>
      <text x="838" y="304" style="font-weight:700;font-size:10px;fill:#0f172a">Orçamento por área</text>
      <g>
        <rect class="grow" x="846" y="370" width="22" height="90" rx="3" fill="url(#bar)"/>
        <rect class="grow" x="880" y="330" width="22" height="130" rx="3" fill="url(#bar)" style="animation-delay:.1s"/>
        <rect class="grow" x="914" y="395" width="22" height="65" rx="3" fill="url(#bar)" style="animation-delay:.2s"/>
        <rect class="grow" x="948" y="350" width="22" height="110" rx="3" fill="url(#bar)" style="animation-delay:.3s"/>
        <rect class="grow" x="982" y="410" width="22" height="50" rx="3" fill="url(#bar)" style="animation-delay:.4s"/>
        <rect class="grow" x="1016" y="385" width="22" height="75" rx="3" fill="url(#bar)" style="animation-delay:.5s"/>
        <line x1="840" y1="460" x2="1046" y2="460" stroke="#e2e8f0"/>
      </g>
      <rect x="1068" y="286" width="148" height="190" rx="8" fill="#fff" stroke="#e2e8f0"/>
      <text x="1080" y="304" style="font-weight:700;font-size:10px;fill:#0f172a">Score de prioridade</text>
      <circle cx="1142" cy="378" r="44" fill="none" stroke="#e2e8f0" stroke-width="10"/>
      <circle cx="1142" cy="378" r="44" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-dasharray="232 277" transform="rotate(-90 1142 378)"/>
      <text x="1142" y="385" text-anchor="middle" style="font-weight:800;font-size:22px;fill:#0f172a">84</text>
      <text class="ui" x="1142" y="450" text-anchor="middle">cada ponto explicado</text>
    </g>
  </g>
</svg>
