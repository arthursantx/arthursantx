<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Arthur Borges</title>
  <desc id="d">Tecnologia, negócios e pessoas. Revenue na Flytour Business Travel, formado em Análise e Desenvolvimento de Sistemas pela FATEC Ipiranga.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b18"/><stop offset=".55" stop-color="#0b1a3a"/><stop offset="1" stop-color="#10306e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".45"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <clipPath id="r"><rect width="1280" height="320" rx="24"/></clipPath>
    <style>
      .k{font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:4px;fill:#7dd3fc}
      .n{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:-1px}
      .s{font:400 21px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#c7d2e6}
      .s b{fill:#fff;font-weight:600}
      .line{fill:none;stroke:#7aa7ff;stroke-opacity:.35;stroke-width:1.4}
      .dot{fill:#bfdbfe}
      .p{animation:p 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .p2{animation-delay:1.1s}.p3{animation-delay:2.1s}
      @keyframes p{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
      .fl{stroke-dasharray:6 10;animation:f 6s linear infinite}
      @keyframes f{to{stroke-dashoffset:-160}}
      @media (prefers-reduced-motion:reduce){.p,.fl{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <rect width="1280" height="320" fill="url(#glow2)"/>
    <!-- rede de conexões -->
    <g>
      <path class="line" d="M860 90 L960 150 L1080 100 L1180 170 M960 150 L1010 240 L1130 250 L1180 170 M1080 100 L1130 250 M860 90 L900 220 L1010 240"/>
      <path class="line fl" stroke="#38bdf8" stroke-opacity=".8" d="M860 90 L960 150 L1080 100 L1180 170 L1130 250 L1010 240 L900 220"/>
      <circle class="dot p" cx="860" cy="90" r="5"/>
      <circle class="dot" cx="960" cy="150" r="7" fill="#38bdf8"/>
      <circle class="dot p p2" cx="1080" cy="100" r="5"/>
      <circle class="dot p p3" cx="1180" cy="170" r="6"/>
      <circle class="dot" cx="1010" cy="240" r="5"/>
      <circle class="dot p" cx="1130" cy="250" r="5"/>
      <circle class="dot p p2" cx="900" cy="220" r="4"/>
      <rect x="935" y="125" width="50" height="50" rx="13" fill="#2563eb" stroke="#93c5fd" stroke-opacity=".6"/>
      <text x="960" y="160" text-anchor="middle" style="font:800 28px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">A</text>
    </g>
    <rect x="72" y="74" width="44" height="3" rx="1.5" fill="url(#acc)"/>
    <text class="k" x="132" y="81">TECNOLOGIA · NEGÓCIOS · PESSOAS</text>
    <text class="n" x="70" y="160">Arthur Borges</text>
    <text class="s" x="72" y="207">Revenue na <tspan font-weight="600" fill="#fff">Flytour Business Travel</tspan> · ADS pela <tspan font-weight="600" fill="#fff">FATEC Ipiranga</tspan></text>
    <text class="s" x="72" y="243" fill="#9fb0cc">Dados, processos e produtos digitais que resolvem problemas reais.</text>
  </g>
</svg>
